version: '3.8'

services:
  # ═════════════════════════════════════════
  # FASTAPI — backend (Python)
  # ═════════════════════════════════════════
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: estoque-wpp-api
    environment:
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-token-change-in-production}
      GROQ_API_KEY_1: ${GROQ_API_KEY_1:-}
      GROQ_API_KEY_2: ${GROQ_API_KEY_2:-}
      DATABASE_URL: ${DATABASE_URL}
      BAILEYS_URL: http://baileys:3000
      API_BASE_URL: http://api:8000
      API_WEBHOOK_URL: http://baileys:3000/webhook/mensagem
    volumes:
      - ./api/app.py:/app/app.py
      - ./api/requirements.txt:/app/requirements.txt
    networks:
      - estoque-network
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    # Sem "ports" publicada: quem fala com a API de fora é o nginx.

  # ═════════════════════════════════════════
  # BAILEYS — WhatsApp (Node.js)
  # ═════════════════════════════════════════
  baileys:
    build:
      context: .
      dockerfile: Dockerfile.baileys
    container_name: estoque-wpp-baileys
    environment:
      API_BASE_URL: http://api:8000
      API_WEBHOOK_URL: http://api:8000/webhook/mensagem
      NODE_ENV: production
    depends_on:
      - api
    volumes:
      - ./baileys/index.js:/app/index.js
      - ./baileys/package.json:/app/package.json
      - baileys_auth:/app/auth_info_estoque
    networks:
      - estoque-network
    command: node index.js

  # ═════════════════════════════════════════
  # NGINX — frontend + reverse proxy
  # ═════════════════════════════════════════
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: estoque-wpp-nginx
    expose:
      - "80"
    depends_on:
      - api
      - baileys
    networks:
      - estoque-network
      - dokploy-network   # <-- ESSENCIAL: sem isso o Traefik não enxerga o container
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wpp-nginx.rule=Host(`wpp.leanttro.com`)"
      - "traefik.http.routers.wpp-nginx.entrypoints=websecure"
      - "traefik.http.routers.wpp-nginx.tls.certresolver=letsencrypt"
      - "traefik.http.services.wpp-nginx.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  baileys_auth:
    driver: local

networks:
  estoque-network:
    driver: bridge
  dokploy-network:
    external: true
