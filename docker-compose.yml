version: '3.8'

services:
  # ═════════════════════════════════════════
  # POSTGRES — banco de dados
  # ═════════════════════════════════════════
  postgres:
    image: postgres:15-alpine
    container_name: estoque-wpp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - estoque-network

  # ═════════════════════════════════════════
  # FASTAPI — backend (Python)
  # ═════════════════════════════════════════
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: estoque-wpp-api
    environment:
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-token-change-in-production}
      GROQ_API_KEY_1: ${GROQ_API_KEY_1:-}
      GROQ_API_KEY_2: ${GROQ_API_KEY_2:-}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      BAILEYS_URL: http://baileys:3000
      API_BASE_URL: http://api:8000
      API_WEBHOOK_URL: http://baileys:3000/webhook/mensagem
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api/app.py:/app/app.py
      - ./api/requirements.txt:/app/requirements.txt
    networks:
      - estoque-network
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  # ═════════════════════════════════════════
  # BAILEYS — WhatsApp (Node.js)
  # ═════════════════════════════════════════
  baileys:
    build:
      context: ./baileys
      dockerfile: Dockerfile
    container_name: estoque-wpp-baileys
    environment:
      API_BASE_URL: http://api:8000
      API_WEBHOOK_URL: http://api:8000/webhook/mensagem
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./baileys/index.js:/app/index.js
      - ./baileys/package.json:/app/package.json
      - baileys_auth:/app/auth_info_estoque
    networks:
      - estoque-network
    command: node index.js

  # ═════════════════════════════════════════
  # NGINX — frontend + reverse proxy
  # ═════════════════════════════════════════
  nginx:
    image: nginx:alpine
    container_name: estoque-wpp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - api
      - baileys
    networks:
      - estoque-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  baileys_auth:
    driver: local
  nginx_certs:
    driver: local

networks:
  estoque-network:
    driver: bridge
