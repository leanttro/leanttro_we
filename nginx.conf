worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20M;

    server {
        listen 80;
        server_name _;

        # ── Frontend estático (login.html, admin.html, dashboard.html) ──
        root /usr/share/nginx/html;
        index login.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # ── Proxy pra API (FastAPI) ──
        # Prefixos conferidos direto no app.py (rotas reais com @app.get/post/...):
        # /auth/*, /admin/*, /produtos, /produtos/{id}, /movimentacoes,
        # /dashboard/*, /webhook/mensagem, /whatsapp/qrcode, /whatsapp/status
        location ~ ^/(auth|admin|produtos|movimentacoes|dashboard|webhook|whatsapp)(/|$) {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OBS: não coloquei proxy direto pro baileys:3000 aqui porque o app.py
        # já expõe /whatsapp/qrcode e /whatsapp/status (ele chama o baileys
        # por dentro via BAILEYS_URL). Se o admin.html/dashboard.html fizer
        # fetch direto em algo tipo /qrcode-raw (fora do /whatsapp/...),
        # eu não tenho o index.js nem os HTMLs nesta sessão pra confirmar —
        # aí precisa adicionar um location /baileys/ { proxy_pass http://baileys:3000/; }
    }
}
