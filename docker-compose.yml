version: '3.8'

services:
  # ═════════════════════════════════════════
  # POSTGRES — banco de dados
  # ═════════════════════════════════════════
  postgres:
    image: postgres:15-alpine
    container_name: estoque-wpp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    # Sem "ports" aqui de propósito: o Postgres NÃO precisa ficar exposto
    # na porta do host. A API já conversa com ele por dentro da rede
    # estoque-network, pelo nome do serviço (postgres:5432).
    # Foi isso que causou o erro "port is already allocated".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - estoque-network

  # ═════════════════════════════════════════
  # FASTAPI — backend (Python)
  # ═════════════════════════════════════════
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: estoque-wpp-api
    environment:
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-token-change-in-production}
      GROQ_API_KEY_1: ${GROQ_API_KEY_1:-}
      GROQ_API_KEY_2: ${GROQ_API_KEY_2:-}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      BAILEYS_URL: http://baileys:3000
      API_BASE_URL: http://api:8000
      API_WEBHOOK_URL: http://baileys:3000/webhook/mensagem
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api/app.py:/app/app.py
      - ./api/requirements.txt:/app/requirements.txt
    networks:
      - estoque-network
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    # Sem "ports" publicada pro host: quem fala com a API de fora é o
    # nginx (reverse proxy). Se quiser debug direto em api.seudominio.com,
    # cria um Domain apontando pro serviço "api", porta 8000, no Dokploy —
    # não precisa reabrir porta aqui pra isso.

  # ═════════════════════════════════════════
  # BAILEYS — WhatsApp (Node.js)
  # ═════════════════════════════════════════
  baileys:
    build:
      context: ./baileys
      dockerfile: Dockerfile
    container_name: estoque-wpp-baileys
    environment:
      API_BASE_URL: http://api:8000
      API_WEBHOOK_URL: http://api:8000/webhook/mensagem
      NODE_ENV: production
    depends_on:
      - api
    volumes:
      - ./baileys/index.js:/app/index.js
      - ./baileys/package.json:/app/package.json
      - baileys_auth:/app/auth_info_estoque
    networks:
      - estoque-network
    command: node index.js
    # Idem: sem porta publicada. Fala com a API por dentro da rede.

  # ═════════════════════════════════════════
  # NGINX — frontend + reverse proxy
  # ═════════════════════════════════════════
  nginx:
    image: nginx:alpine
    container_name: estoque-wpp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - api
      - baileys
    networks:
      - estoque-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  baileys_auth:
    driver: local
  nginx_certs:
    driver: local

networks:
  estoque-network:
    driver: bridge
